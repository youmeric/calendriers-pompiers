# docker-compose.yml — Calendriers des pompiers (Courzieu & Brussieu)
#
# Premier lancement (voir README) :
#   cp .env.example .env && nano .env          # mot de passe admin, réseau NPM
#   docker compose run --rm --build pipeline    # télécharge adresses + routes
#   docker compose up -d --build backend
#
# Données sur le serveur (bind mounts, faciles à sauvegarder) :
#   ./data/db/       base SQLite (secteurs, équipes, suivi, dons) et ./data/db/sauvegardes/
#                    (une sauvegarde automatique par jour, 30 gardées)
#   ./data/sectors/  fichiers générés par le pipeline
#   ./data/cache/    téléchargements BAN / OSM

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: calendriers-pompiers-backend
    container_name: calendriers-pompiers
    restart: unless-stopped
    # Nginx Proxy Manager joint l'app par le nom du conteneur
    # (http://calendriers-pompiers:8000) via le réseau Docker partagé.
    # Le port n'est publié que sur 127.0.0.1 : jamais exposé directement à Internet.
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Paris
      - DB_PATH=/app/db/status.db
      - SECTORS_DATA_DIR=/app/sectors
    volumes:
      - ./data/db:/app/db
      - ./data/sectors:/app/sectors
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/communes')"]
      interval: 30s
      timeout: 5s
      retries: 3

  pipeline:
    build:
      context: .
      dockerfile: data_pipeline/Dockerfile
    image: calendriers-pompiers-pipeline
    profiles: ["pipeline"]
    environment:
      - SECTORS_OUTPUT_DIR=/app/sectors
      - BAN_CACHE_DIR=/app/cache
    volumes:
      - ./data/sectors:/app/sectors
      - ./data/cache:/app/cache

networks:
  proxy:
    # réseau Docker de Nginx Proxy Manager, créé en dehors de ce projet
    external: true
    name: ${PROXY_NETWORK:-proxy}
