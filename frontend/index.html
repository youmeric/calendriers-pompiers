<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c62828" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Secteurs" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>Calendriers des pompiers — Courzieu &amp; Brussieu</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="css/style.css?v=__V__" />
</head>
<body class="public">
  <header class="topbar">
    <h1>🚒 Calendriers des pompiers</h1>
    <span class="topbar-sub">Courzieu · Brussieu</span>
  </header>

  <main class="public-main">
    <section id="map" aria-label="Carte des secteurs"></section>

    <!-- Vue d'ensemble : tous les secteurs -->
    <section id="home-panel" class="panel">
      <div class="search">
        <input id="search" type="search" autocomplete="off" placeholder="🔍 Rechercher une adresse, une rue, un hameau…" aria-label="Rechercher une adresse, une rue ou un hameau" />
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <h2 class="panel-title">Choisissez votre secteur</h2>
      <div id="sector-buttons" class="sector-buttons"></div>
      <p id="no-sectors" class="empty" hidden>Les secteurs n'ont pas encore été définis. Revenez un peu plus tard.</p>
      <a id="btn-print-all" class="btn print-link" href="#" target="_blank" rel="noopener" hidden>🖨 Plan d'ensemble à imprimer</a>
    </section>

    <!-- Vue d'un secteur -->
    <section id="sector-panel" class="panel" hidden>
      <div class="sector-bar">
        <button id="btn-back" class="btn" type="button">← Secteurs</button>
        <a id="btn-print" class="btn" href="#" target="_blank" rel="noopener">🖨 Plan</a>
        <button id="btn-share" class="btn" type="button">Partager</button>
      </div>
      <h2 class="sector-heading"><b id="sector-code" class="sector-code"></b><span id="sector-name"></span></h2>
      <p id="sector-summary" class="hint"></p>

      <section class="info-card">
        <h3>Où s'arrête le secteur</h3>
        <div id="sector-limite"></div>
      </section>

      <section class="info-card">
        <h3>Ce que comprend le secteur</h3>
        <div id="sector-resume"></div>
      </section>

      <section id="suivi-block" hidden>
        <h3 class="suivi-title">Suivi de la distribution</h3>
        <div id="sector-progress" class="progress-bar" aria-hidden="true"></div>
        <p id="sector-stats" class="hint"></p>
        <label class="toggle"><input type="checkbox" id="hide-done" /> Masquer les adresses déjà traitées</label>
        <div id="address-list"></div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/common.js?v=__V__"></script>
  <script src="js/app.js?v=__V__"></script>
</body>
</html>
