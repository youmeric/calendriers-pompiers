<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Calendriers Pompiers — Courzieu &amp; Brussieu</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🚒 Distribution des calendriers</h1>
    <select id="commune-select" aria-label="Choisir la commune"></select>
  </header>

  <main>
    <section id="map" aria-label="Carte des secteurs"></section>

    <section id="panel">
      <div class="panel-header">
        <div id="global-progress" class="progress-bar" aria-hidden="true"></div>
        <button id="toggle-map" class="btn-ghost" type="button">Réduire la carte</button>
      </div>
      <div id="sectors-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
